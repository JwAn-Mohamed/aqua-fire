<!DOCTYPE html>
<html>
<head>
  <title>AquaQuest</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <!-- Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

 <!-- RPG Dashboard UI -->
  <div id="rpg-dashboard" style="
    position: absolute; top: 20px; right: 20px; z-index: 1000;
    background-color: #222; color: white; border: 4px solid #fff;
    padding: 10px 20px; font-family: 'Courier New', Courier, monospace;
    font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: 4px 4px 0px #000;
  ">
    <div id="hp-display" style="color: #ff4d4d; margin-bottom: 5px;">❤️ HP: 100</div>
    <div id="score-display" style="color: #4da6ff;">⭐ Score: 0</div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <script>
    // 1. Set up the score and the map (zoomed out to see the whole country)
    let playerScore = 0;
    const map = L.map('map').setView([39.8283, -98.5795], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 2. Define your custom pixel-art monster sprite
    const monsterSprite = L.icon({
      iconUrl: 'monster.png', // Be sure your image is actually named monster.png in your repo!
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -40]
    });

    // Keep track of active markers to delete them later
    const activeMarkers = {};

    // 3. Fetch the generated AI data
    fetch('hotspots.json')
      .then(response => response.json())
      .then(data => {
        data.forEach(spot => {
          // Add a marker using your custom sprite
          const marker = L.marker([spot.lat, spot.lng], {icon: monsterSprite}).addTo(map);
          activeMarkers[spot.id] = marker;

          // Build the retro trivia popup
          const popupContent = `
            <div style="font-family: 'Courier New', Courier, monospace; text-align: center;">
              <h3 style="color: red;">Wild ${spot.type} appeared!</h3>
              <p><strong>Severity:</strong> ${spot.severity}</p>
              <p><em>${spot.question}</em></p>
             
              <button onclick="checkAnswer(${spot.id}, 0, ${spot.correct_index})" style="margin: 2px;">${spot.options[0]}</button>
              <button onclick="checkAnswer(${spot.id}, 1, ${spot.correct_index})" style="margin: 2px;">${spot.options[1]}</button>
              <button onclick="checkAnswer(${spot.id}, 2, ${spot.correct_index})" style="margin: 2px;">${spot.options[2]}</button>
              <p id="result-${spot.id}" style="color: blue; font-weight: bold; margin-top: 5px;"></p>
            </div>
          `;

          marker.bindPopup(popupContent);
        });
      })
      .catch(error => console.error('Error loading hotspots:', error));

    // 4. Game Logic: Checking answers and updating score
    function checkAnswer(spotId, selectedIndex, correctIndex) {
      const resultText = document.getElementById(`result-${spotId}`);
     
      if (selectedIndex === correctIndex) {
        resultText.style.color = "green";
        resultText.innerText = "Super Effective! Monster Defeated!";
       
        // Add XP and update the on-screen score UI
        playerScore += 100;
        document.getElementById('score-display').innerText = "Score: " + playerScore;
       
        // Wait 1 second, then remove the monster from the map
        setTimeout(() => {
          map.removeLayer(activeMarkers[spotId]);
        }, 1000);
       
      } else {
        resultText.style.color = "red";
        resultText.innerText = "Not very effective... Try again!";
      }
    }
  </script>
</body>
</html>
