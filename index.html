<!DOCTYPE html>
<html>
<head>
  <title>AquaQuest</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #0a1f2d; }
    #map { width: 100vw; height: 100vh; }
    .leaflet-tile {
      image-rendering: pixelated;
      filter: sepia(0.2) hue-rotate(160deg) saturate(2) contrast(1.2);
    }
    #kubble-input::placeholder {
      color: #5c8599;
    }
  </style>
</head>
<body>

    <h1 style="font-size: 60px; color: #17b978; margin-bottom: 10px; text-shadow: 4px 4px 0px #0b3c5d;">YOU SAVED THE OCEAN!</h1>
    <div id="final-score-display" style="font-size: 30px; color: #ffcc00; font-weight: bold; margin-bottom: 40px;"></div>
    <button onclick="location.reload()" style="background-color: #17b978; color: white; border: 4px solid #0b3c5d; border-radius: 8px; padding: 15px 30px; font-size: 24px; font-weight: bold; cursor: pointer; font-family: 'Courier New', Courier, monospace; box-shadow: 4px 4px 0px #000;">Play Again</button>
  </div>

  <div id="rpg-dashboard" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background-color: #0b3c5d; color: white; border: 4px solid #3282b8; padding: 10px 20px; font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: 4px 4px 0px #000;">
    <div id="level-display" style="color: #a8e6cf; margin-bottom: 5px;">👑 Level: 1</div>
    <div id="hp-display" style="color: #ff8b94; margin-bottom: 5px;">❤️ HP: 100</div>
    <div id="score-display" style="color: #dcedc1;">⭐ Score: 0</div>
  </div>

  <div id="irl-quest" style="position: absolute; bottom: 20px; right: 20px; z-index: 1000;">
    <label for="trash-upload" style="background-color: #17b978; color: white; padding: 12px 18px; border: 3px solid #0b3c5d; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000;">
      📸 Upload IRL Cleanup! (+500 pts)
    </label>
    <input type="file" id="trash-upload" accept="image/*" capture="environment" style="display: none;">
  </div>
