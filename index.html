<!DOCTYPE html>
<html>
<head>
  <title>AquaQuest</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #0a1f2d; }
    #map { width: 100vw; height: 100vh; }
    .leaflet-tile {
      image-rendering: pixelated;
      filter: sepia(0.2) hue-rotate(160deg) saturate(2) contrast(1.2);
    }
  </style>
</head>
<body>

  <div id="win-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(10, 31, 45, 0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; color: white; text-align: center;">
    <h1 style="font-size: 60px; color: #17b978; margin-bottom: 10px; text-shadow: 4px 4px 0px #0b3c5d;">YOU SAVED THE OCEAN!</h1>
    <div id="final-score-display" style="font-size: 30px; color: #ffcc00; font-weight: bold; margin-bottom: 40px;"></div>
    <button onclick="location.reload()" style="background-color: #17b978; color: white; border: 4px solid #0b3c5d; border-radius: 8px; padding: 15px 30px; font-size: 24px; font-weight: bold; cursor: pointer; font-family: 'Courier New', Courier, monospace; box-shadow: 4px 4px 0px #000;">Play Again</button>
  </div>

  <div id="rpg-dashboard" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background-color: #0b3c5d; color: white; border: 4px solid #3282b8; padding: 10px 20px; font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: 4px 4px 0px #000;">
    <div id="level-display" style="color: #a8e6cf; margin-bottom: 5px;">👑 Level: 1</div>
    <div id="hp-display" style="color: #ff8b94; margin-bottom: 5px;">❤️ HP: 100</div>
    <div id="score-display" style="color: #dcedc1;">⭐ Score: 0</div>
  </div>

  <div id="irl-quest" style="position: absolute; bottom: 20px; right: 20px; z-index: 1000;">
    <label for="trash-upload" style="background-color: #17b978; color: white; padding: 12px 18px; border: 3px solid #0b3c5d; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000;">
      📸 Upload IRL Cleanup! (+500 pts)
    </label>
    <input type="file" id="trash-upload" accept="image/*" capture="environment" style="display: none;">
  </div>

  <div id="kubble-container" style="position: absolute; bottom: 20px; left: 20px; z-index: 1000; display: flex; align-items: flex-end; gap: 20px;">
    <div id="kubble-speech" style="background-color: #e8f4f8; border: 4px solid #0b3c5d; border-radius: 10px; color: #0b3c5d; padding: 20px 25px; font-family: 'Courier New', Courier, monospace; font-size: 24px; font-weight: bold; max-width: 400px; box-shadow: 4px 4px 0px #0b3c5d; margin-bottom: 80px; position: relative;">
      Let's clean up the ocean! Click the map to find monsters!
    </div>
    <img id="kubble-sprite" src="kubble.png" alt="Kubble" style="width: 250px; height: auto; image-rendering: pixelated; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.3));">
  </div>

  <div id="map"></div>

  <script>
    // ==========================================
    // 🔑 API KEY SETUP (Paste once here!)
    // ==========================================
    const GLOBAL_API_KEY = "YOUR_API_KEY_HERE"; 

    // --- Stats & Audio ---
    let playerScore = 0;
    let playerHP = 100;
    let playerLevel = 1;

    const cheerSound = new Audio('cheer.mp3');
    const ouchSound = new Audio('ouch.mp3');
    const levelUpSound = new Audio('levelup.mp3');

    function triggerKubbleReaction(soundType) {
      const kubbleSprite = document.getElementById('kubble-sprite');
      if (soundType === "cheer") { cheerSound.play().catch(e=>e); kubbleSprite.src = "Kubble-happy.png"; } 
      else if (soundType === "ouch") { ouchSound.play().catch(e=>e); kubbleSprite.src = "Kubble-hurt.png"; } 
      else if (soundType === "levelup") { levelUpSound.play().catch(e=>e); kubbleSprite.src = "Kubble-happy.png"; } 
      else { kubbleSprite.src = "kubble.png"; }
    }

    // --- Map Setup ---
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    
    const monsterSprite = L.icon({ iconUrl: 'monster.png', iconSize: [40, 40], iconAnchor: [20, 40], popupAnchor: [0, -40] });
    const activeMarkers = {};

    // --- AI Trivia Generation ---
    async function spawnAIMonster(lat, lng, monsterType, severityLevel) {
      const spotId = Math.floor(Math.random() * 100000);
      const marker = L.marker([lat, lng], {icon: monsterSprite}).addTo(map);
      activeMarkers[spotId] = marker;
      marker.bindPopup(`<div style="text-align:center; color:#0b3c5d; font-family: 'Courier New', Courier, monospace;"><b>Generating AI trivia... ⏳</b></div>`);

      const prompt = `You are a trivia generator for an environmental game. 
      Generate one multiple choice trivia question about ocean pollution. 
      Respond ONLY with a valid JSON object in this exact format, with no extra text or markdown:
      {
        "question": "The trivia question goes here?",
        "options": ["Option 1", "Option 2", "Option 3"],
        "correct_index": 1
      }`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GLOBAL_API_KEY}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        
        if (data.error) throw new Error(data.error.message);
        
        let cleanJson = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        const trivia = JSON.parse(cleanJson);
        
        marker.setPopupContent(`
          <div style="font-family: 'Courier New', Courier, monospace; text-align: center; color: #0b3c5d;">
            <h3 style="color: #17b978;">Wild ${monsterType} appeared!</h3>
            <p><strong>Severity:</strong> ${severityLevel}</p>
            <p><em>${trivia.question}</em></p>
            <button onclick="checkAnswer(${spotId}, 0, ${trivia.correct_index})" style="margin: 2px; padding: 5px; cursor: pointer; background: #bbe1fa; border: 2px solid #0b3c5d; font-weight:bold;">${trivia.options[0]}</button><br>
            <button onclick="checkAnswer(${spotId}, 1, ${trivia.correct_index})" style="margin: 2px; padding: 5px; cursor: pointer; background: #bbe1fa; border: 2px solid #0b3c5d; font-weight:bold;">${trivia.options[1]}</button><br>
            <button onclick="checkAnswer(${spotId}, 2, ${trivia.correct_index})" style="margin: 2px; padding: 5px; cursor: pointer; background: #bbe1fa; border: 2px solid #0b3c5d; font-weight:bold;">${trivia.options[2]}</button>
            <p id="result-${spotId}" style="color: #3282b8; font-weight: bold; margin-top: 5px;"></p>
          </div>
        `);
      } catch (error) {
        console.error("AI generation failed.", error);
        marker.setPopupContent(`<div style="color: red; font-family: 'Courier New';"><b>AI Connection Failed!</b><br>Check your API key.</div>`);
      }
    }

    spawnAIMonster(39.8, -98.5, "Plastic Blob", "High");
    spawnAIMonster(35.0, -110.0, "Oil Slick", "Medium");
    spawnAIMonster(42.0, -80.0, "Microplastic Swarm", "Low");

    map.on('click', function(e) {
      spawnAIMonster(e.latlng.lat, e.latlng.lng, "Toxic Sludge", "Unknown");
    });

    const trashSprite = L.icon({ iconUrl: 'trash.jpg', iconSize: [30, 30] });
    for (let i = 0; i < 40; i++) {
      let trashMarker = L.marker([25 + (Math.random() * 23), -125 + (Math.random() * 55)], {icon: trashSprite}).addTo(map);
      trashMarker.on('click', function() {
        playerScore += 20; 
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
        map.removeLayer(trashMarker);
        triggerKubbleReaction("cheer");
        setTimeout(() => triggerKubbleReaction("neutral"), 1500);
      });
    }

    window.checkAnswer = function(spotId, selectedIndex, correctIndex) {
      const resultText = document.getElementById(`result-${spotId}`);
      if (selectedIndex === correctIndex) {
        playerScore += 100;
        if (playerScore >= playerLevel * 300) {
          playerLevel++; playerHP = 100; 
          document.getElementById('level-display').innerText = "👑 Level: " + playerLevel;
          document.getElementById('hp-display').innerText = "❤️ HP: " + playerHP;
          if (playerLevel >= 5) {
            document.getElementById('win-screen').style.display = "flex";
            document.getElementById('final-score-display').innerText = "Final Score: " + playerScore;
            return; 
          }
          triggerKubbleReaction("levelup"); 
        } else { triggerKubbleReaction("cheer"); }

        resultText.style.color = "#17b978"; resultText.innerHTML = "Correct! 🌊";
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
        setTimeout(() => { map.removeLayer(activeMarkers[spotId]); triggerKubbleReaction("neutral"); }, 2000);
      } else {
        playerHP -= 20; document.getElementById('hp-display').innerText = "❤️ HP: " + playerHP;
        triggerKubbleReaction("ouch"); 
        if (playerHP <= 0) {
          resultText.style.color = "red"; resultText.innerText = "Game Over.";
          setTimeout(() => location.reload(), 2000);
        } else {
          resultText.style.color = "orange"; resultText.innerText = "Wrong! -20 HP 💥";
          setTimeout(() => triggerKubbleReaction("neutral"), 2000);
        }
      }
    };

    // --- AI Image Recognition (IRL Sidequest) ---
    const trashUpload = document.getElementById('trash-upload');
    if (trashUpload) {
      trashUpload.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const kubbleSpeech = document.getElementById('kubble-speech');
        kubbleSpeech.innerText = "Scanning image with AI... ⏳";
        triggerKubbleReaction("neutral");

        // Convert image file to Base64 to send to Gemini
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function() {
          const base64Data = reader.result.split(',')[1];
          
          const payload = {
            contents: [{
              parts: [
                { text: "Does this image contain trash, garbage, litter, or pollution? Respond with exactly one word: YES or NO." },
                { inline_data: { mime_type: file.type, data: base64Data } }
              ]
            }]
          };

          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GLOBAL_API_KEY}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if (data.error) throw new Error(data.error.message);

            const aiAnswer = data.candidates[0].content.parts[0].text.trim().toUpperCase();

            if (aiAnswer.includes("YES")) {
              playerScore += 500; 
              document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
              kubbleSpeech.innerText = "AMAZING! Trash detected! +500 POINTS!";
              triggerKubbleReaction("cheer"); 
            } else {
              kubbleSpeech.innerText = "Hmm, I don't see any trash in that picture. Try another one!";
              triggerKubbleReaction("ouch"); 
            }
          } catch (error) {
            console.error("AI Vision failed.", error);
            kubbleSpeech.innerText = "AI Vision failed! Check your API key or internet.";
            triggerKubbleReaction("ouch");
          }
          
          event.target.value = ""; // Reset the file input
          setTimeout(() => {
             triggerKubbleReaction("neutral"); 
             kubbleSpeech.innerText = "Let's clean up the ocean! Click the map to battle!";
          }, 4000);
        };
      });
    }
  </script>
</body>
</html>
