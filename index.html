<!DOCTYPE html>
<html>
<head>
  <title>AquaQuest</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <!-- Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #0a1f2d; }
    #map { width: 100vw; height: 100vh; }
   
    /* Pixelated retro map with a blue/green ocean tint! */
    .leaflet-tile {
      image-rendering: pixelated;
      filter: sepia(0.2) hue-rotate(160deg) saturate(2) contrast(1.2);
    }
   
    /* Huge Spinning Earth Marker */
    @keyframes spin-earth {
      100% { transform: rotate(360deg); }
    }
    .spinning-earth-marker {
      font-size: 60px; /* Increased size! */
      animation: spin-earth 4s linear infinite;
      text-align: center;
      line-height: 60px;
      filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <!-- RPG Dashboard UI (Blue/Green Theme) -->
  <div id="rpg-dashboard" style="
    position: absolute; top: 20px; right: 20px; z-index: 1000;
    background-color: #0b3c5d; color: white; border: 4px solid #3282b8;
    padding: 10px 20px; font-family: 'Courier New', Courier, monospace;
    font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: 4px 4px 0px #000;
  ">
    <div id="level-display" style="color: #a8e6cf; margin-bottom: 5px;">👑 Level: 1</div>
    <div id="hp-display" style="color: #ff8b94; margin-bottom: 5px;">❤️ HP: 100</div>
    <div id="score-display" style="color: #dcedc1;">⭐ Score: 0</div>
  </div>

  <!-- Real-Life Sidequest UI -->
  <div id="irl-quest" style="
    position: absolute; bottom: 220px; right: 20px; z-index: 1000;
  ">
    <label for="trash-upload" style="
      background-color: #17b978; color: white; padding: 12px 18px;
      border: 3px solid #0b3c5d; border-radius: 8px; font-family: 'Courier New', Courier, monospace;
      font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000;
    ">
      📸 Upload IRL Cleanup! (+500 pts)
    </label>
    <input type="file" id="trash-upload" accept="image/*" capture="environment" style="display: none;">
  </div>

  <!-- Kubble Companion UI -->
  <div id="kubble-container" style="
    position: absolute; bottom: 20px; right: 20px; z-index: 1000;
    display: flex; align-items: flex-end; gap: 15px;
  ">
    <div id="kubble-speech" style="
      background-color: #e8f4f8; border: 4px solid #0b3c5d; border-radius: 10px; color: #0b3c5d;
      padding: 15px 20px; font-family: 'Courier New', Courier, monospace;
      font-size: 18px; font-weight: bold; max-width: 300px;
      box-shadow: 4px 4px 0px #0b3c5d; margin-bottom: 45px;
      position: relative;
    ">
      Let's clean up the ocean! Click a monster to battle!
      <div style="
        position: absolute; right: -15px; bottom: 15px;
        width: 0; height: 0;
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 15px solid #0b3c5d;
      "></div>
    </div>
    <!-- Kubble is wider and uses height:auto to maintain his round bubble shape! -->
    <img id="kubble-sprite" src="image_02bdde.png" alt="Kubble" style="width: 170px; height: auto; image-rendering: pixelated; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.3));">
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <script>
    // --- RPG Stats & Audio Setup ---
    let playerScore = 0;
    let playerHP = 100;
    let playerLevel = 1;

    const cheerSound = new Audio('cheer.mp3');
    const ouchSound = new Audio('ouch.mp3');
    const levelUpSound = new Audio('levelup.mp3');

    // --- Map Setup ---
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
   
    // The BIG Spinning Earth Marker!
    const earthIcon = L.divIcon({
      className: 'spinning-earth-marker',
      html: '🌍',
      iconSize: [60, 60],
      iconAnchor: [30, 30]
    });

    const activeMarkers = {};

    // --- Fetch Monsters ---
    fetch('hotspots.json')
      .then(response => response.json())
      .then(data => {
        data.forEach(spot => {
          // WE REPLACED THE MONSTER PINS WITH THE EARTH ICON HERE!
          const marker = L.marker([spot.lat, spot.lng], {icon: earthIcon}).addTo(map);
          activeMarkers[spot.id] = marker;

          const popupContent = `
            <div style="font-family: 'Courier New', Courier, monospace; text-align: center; color: #0b3c5d;">
              <h3 style="color: #17b978;">Wild ${spot.type} appeared!</h3>
              <p><strong>Severity:</strong> ${spot.severity}</p>
              <p><em>${spot.question}</em></p>
             
              <button onclick="checkAnswer(${spot.id}, 0, ${spot.correct_index})" style="margin: 2px; padding: 5px; cursor: pointer; background: #bbe1fa; border: 2px solid #0b3c5d; font-weight:bold;">${spot.options[0]}</button><br>
              <button onclick="checkAnswer(${spot.id}, 1, ${spot.correct_index})" style="margin: 2px; padding: 5px; cursor: pointer; background: #bbe1fa; border: 2px solid #0b3c5d; font-weight:bold;">${spot.options[1]}</button><br>
              <button onclick="checkAnswer(${spot.id}, 2, ${spot.correct_index})" style="margin: 2px; padding: 5px; cursor: pointer; background: #bbe1fa; border: 2px solid #0b3c5d; font-weight:bold;">${spot.options[2]}</button>
              <p id="result-${spot.id}" style="color: #3282b8; font-weight: bold; margin-top: 5px;"></p>
            </div>
          `;
          marker.bindPopup(popupContent);
        });
      })
      .catch(error => console.error('Error loading hotspots:', error));

    // --- Loose Trash Mini-Game ---
    const trashSprite = L.icon({
      iconUrl: 'trash.png',
      iconSize: [30, 30]
    });

    for (let i = 0; i < 40; i++) {
      let randomLat = 25 + (Math.random() * 23);
      let randomLng = -125 + (Math.random() * 55);
      let trashMarker = L.marker([randomLat, randomLng], {icon: trashSprite}).addTo(map);
     
      trashMarker.on('click', function() {
        playerScore += 20;
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
        map.removeLayer(trashMarker);
       
        const kubbleSpeech = document.getElementById('kubble-speech');
        const kubbleSprite = document.getElementById('kubble-sprite');
       
        kubbleSpeech.innerText = "Snagged it! The ocean is getting cleaner!";
        kubbleSprite.src = "image_02bdfa.png"; // Happy Kubble
       
        setTimeout(() => {
           kubbleSprite.src = "image_02bdde.png"; // Back to Neutral Kubble
        }, 1500);
      });
    }

    // --- Main Battle Logic with Dynamic Images ---
    window.checkAnswer = function(spotId, selectedIndex, correctIndex) {
      const resultText = document.getElementById(`result-${spotId}`);
      const kubbleSpeech = document.getElementById('kubble-speech');
      const kubbleSprite = document.getElementById('kubble-sprite');
     
      if (selectedIndex === correctIndex) {
        playerScore += 100;
        let levelUpText = "";

        // SWAP TO HAPPY KUBBLE[cite: 6]
        kubbleSprite.src = "image_02bdfa.png";

        if (playerScore >= playerLevel * 300) {
          playerLevel++;
          playerHP = 100;
          levelUpText = ` <br>🌟 LEVEL UP to Lv.${playerLevel}!`;
         
          document.getElementById('level-display').innerText = "👑 Level: " + playerLevel;
          document.getElementById('hp-display').innerText = "❤️ HP: " + playerHP;
         
          kubbleSpeech.innerText = `Whoa! Level ${playerLevel}! You're unstoppable!`;
          levelUpSound.play().catch(e => console.log("Audio prevented"));
        } else {
          kubbleSpeech.innerText = "Great job! That's one less piece of trash!";
          cheerSound.play().catch(e => console.log("Audio prevented"));
        }

        resultText.style.color = "#17b978";
        resultText.innerHTML = "Correct! You cast Aqua Blast! 🌊" + levelUpText;
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
       
        setTimeout(() => {
          map.removeLayer(activeMarkers[spotId]);
          kubbleSpeech.innerText = "Keep it up! Find the next monster!";
          kubbleSprite.src = "image_02bdde.png"; // SWAP BACK TO NEUTRAL KUBBLE[cite: 7]
        }, 2000);
       
      } else {
        playerHP -= 20;
        document.getElementById('hp-display').innerText = "❤️ HP: " + playerHP;
       
        // SWAP TO HURT KUBBLE
        kubbleSprite.src = "image_02be1a.png";

        if (playerHP <= 0) {
          resultText.style.color = "red";
          resultText.innerText = "Game Over.";
          kubbleSpeech.innerText = "Oh no... the ocean needs a break. Let's try again!";
         
          setTimeout(() => {
            alert("Game Over! Refresh the page to try again.");
            location.reload();
          }, 2000);
        } else {
          resultText.style.color = "orange";
          resultText.innerText = "Wrong! The monster attacks! -20 HP 💥";
          kubbleSpeech.innerText = "Ouch! Watch out for their pollution attacks!";
          ouchSound.play().catch(e => console.log("Audio prevented"));
         
          setTimeout(() => {
            kubbleSprite.src = "image_02bdde.png"; // SWAP BACK TO NEUTRAL KUBBLE[cite: 7]
          }, 2000);
        }
      }
    };

    // --- IRL Sidequest Logic ---
    document.getElementById('trash-upload').addEventListener('change', function(event) {
      if (event.target.files.length > 0) {
        playerScore += 500;
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
       
        const kubbleSpeech = document.getElementById('kubble-speech');
        const kubbleSprite = document.getElementById('kubble-sprite');
       
        kubbleSpeech.innerText = "AMAZING! You are a real-world hero! +500 POINTS!";
        kubbleSprite.src = "image_02bdfa.png"; // Happy Kubble[cite: 6]
        cheerSound.play().catch(e => console.log("Audio prevented"));
       
        alert("Hero detected! 500 bonus points awarded for cleaning up the real world!");
        event.target.value = "";
       
        setTimeout(() => {
           kubbleSprite.src = "image_02bdde.png"; // Back to Neutral Kubble[cite: 7]
           kubbleSpeech.innerText = "Let's clean up the ocean! Click a monster to battle!";
        }, 3000);
      }
    });
  </script>
</body>
</html>
