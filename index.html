<!DOCTYPE html>
<html>
<head>
  <title>AquaQuest</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <!-- Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
  <!-- Retro 8-bit Font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
 
  <style>
    body {
      margin: 0; padding: 0; overflow: hidden; background-color: #0a1f2d;
      font-family: 'Press Start 2P', Courier, monospace;
    }
    #map { width: 100vw; height: 100vh; }
   
    /* Pixelated retro map with a blue/green ocean tint */
    .leaflet-tile {
      image-rendering: pixelated;
      filter: sepia(0.2) hue-rotate(160deg) saturate(2) contrast(1.2);
    }

    /* Override Leaflet Popup to look like a retro battle menu */
    .leaflet-popup-content-wrapper {
      background-color: #0b3c5d;
      border: 4px solid #a8e6cf;
      border-radius: 0; /* Blocky corners */
      box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
      color: white;
    }
    .leaflet-popup-tip {
      background-color: #a8e6cf;
    }
    .leaflet-popup-close-button {
      color: white !important;
    }

    /* Chunky RPG Buttons */
    .rpg-btn {
      background-color: #17b978;
      color: white;
      border: 3px solid #06263f;
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 9px;
      line-height: 1.5;
      cursor: pointer;
      box-shadow: 3px 3px 0px #06263f;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .rpg-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px #06263f;
    }
    .rpg-btn:hover {
      background-color: #a8e6cf;
      color: #0b3c5d;
    }

    /* Dashboard & Floating Elements */
    .ui-panel {
      background-color: #0b3c5d;
      color: white;
      border: 4px solid #3282b8;
      padding: 15px;
      box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- RPG Dashboard UI -->
  <div class="ui-panel" style="
    position: absolute; top: 20px; right: 20px; z-index: 1000;
    font-size: 12px; line-height: 2; min-width: 180px;
  ">
    <div id="level-display" style="color: #a8e6cf;">👑 Level: 1</div>
    <div id="hp-display" style="color: #ff8b94;">❤️ HP: 100</div>
    <div id="score-display" style="color: #dcedc1;">⭐ Score: 0</div>
  </div>

  <!-- Real-Life Sidequest UI -->
  <div style="position: absolute; bottom: 240px; right: 20px; z-index: 1000;">
    <label for="trash-upload" style="
      display: inline-block;
      background-color: #17b978; color: white; padding: 12px 15px;
      border: 4px solid #0b3c5d; font-family: 'Press Start 2P', monospace;
      font-size: 10px; cursor: pointer; box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
      text-align: center; line-height: 1.5;
    ">
      📸 IRL Quest!<br>(+500 pts)
    </label>
    <input type="file" id="trash-upload" accept="image/*" capture="environment" style="display: none;">
  </div>

  <!-- Kubble Companion UI -->
  <div id="kubble-container" style="
    position: absolute; bottom: 20px; right: 20px; z-index: 1000;
    display: flex; align-items: flex-end; gap: 15px;
  ">
    <div class="ui-panel" id="kubble-speech" style="
      background-color: #e8f4f8; color: #0b3c5d; border-color: #0b3c5d;
      font-size: 10px; line-height: 1.6; max-width: 250px; margin-bottom: 50px;
      position: relative;
    ">
      Let's clean up the ocean! Click a monster!
      <div style="
        position: absolute; right: -12px; bottom: 15px;
        width: 0; height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 12px solid #0b3c5d;
      "></div>
    </div>
    <img id="kubble-sprite" src="image_02bdde.png" alt="Kubble" style="
      width: 150px; height: auto; image-rendering: pixelated;
      filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5));
    ">
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <script>
    // --- RPG Stats & Audio Setup ---
    let playerScore = 0;
    let playerHP = 100;
    let playerLevel = 1;

    const cheerSound = new Audio('cheer.mp3');
    const ouchSound = new Audio('ouch.mp3');
    const levelUpSound = new Audio('levelup.mp3');

    // --- Map Setup ---
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
   
    // --- Monster Sprite ---
    const monsterSprite = L.icon({
      iconUrl: 'monster.png',
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -40]
    });

    const activeMarkers = {};

    // --- Fetch Monsters ---
    fetch('hotspots.json')
      .then(response => response.json())
      .then(data => {
        data.forEach(spot => {
          const marker = L.marker([spot.lat, spot.lng], {icon: monsterSprite}).addTo(map);
          activeMarkers[spot.id] = marker;

          const popupContent = `
            <div style="text-align: center;">
              <h3 style="color: #17b978; font-size: 12px; line-height: 1.5;">Wild ${spot.type} appeared!</h3>
              <p style="font-size: 9px; line-height: 1.5; color: #a8e6cf;">Severity: ${spot.severity}</p>
              <p style="font-size: 10px; line-height: 1.4; margin-bottom: 15px;">${spot.question}</p>
             
              <button class="rpg-btn" onclick="checkAnswer(${spot.id}, 0, ${spot.correct_index})">${spot.options[0]}</button>
              <button class="rpg-btn" onclick="checkAnswer(${spot.id}, 1, ${spot.correct_index})">${spot.options[1]}</button>
              <button class="rpg-btn" onclick="checkAnswer(${spot.id}, 2, ${spot.correct_index})">${spot.options[2]}</button>
             
              <p id="result-${spot.id}" style="color: #a8e6cf; font-size: 9px; margin-top: 10px;"></p>
            </div>
          `;
          marker.bindPopup(popupContent);
        });
      })
      .catch(error => console.error('Error loading hotspots:', error));

    // --- Loose Trash Mini-Game ---
    const trashSprite = L.icon({
      iconUrl: 'trash.png',
      iconSize: [30, 30]
    });

    for (let i = 0; i < 40; i++) {
      let randomLat = 25 + (Math.random() * 23);
      let randomLng = -125 + (Math.random() * 55);
      let trashMarker = L.marker([randomLat, randomLng], {icon: trashSprite}).addTo(map);
     
      trashMarker.on('click', function() {
        playerScore += 20;
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
        map.removeLayer(trashMarker);
       
        const kubbleSpeech = document.getElementById('kubble-speech');
        const kubbleSprite = document.getElementById('kubble-sprite');
       
        kubbleSpeech.innerText = "Snagged it! +20 XP";
        kubbleSprite.src = "image_02bdfa.png"; // Happy Kubble[cite: 6]
       
        setTimeout(() => {
           kubbleSprite.src = "image_02bdde.png"; // Back to Neutral Kubble
        }, 1500);
      });
    }

    // --- Main Battle Logic ---
    window.checkAnswer = function(spotId, selectedIndex, correctIndex) {
      const resultText = document.getElementById(`result-${spotId}`);
      const kubbleSpeech = document.getElementById('kubble-speech');
      const kubbleSprite = document.getElementById('kubble-sprite');
     
      if (selectedIndex === correctIndex) {
        playerScore += 100;
        let levelUpText = "";

        kubbleSprite.src = "image_02bdfa.png"; // Happy Kubble[cite: 6]

        if (playerScore >= playerLevel * 300) {
          playerLevel++;
          playerHP = 100;
          levelUpText = ` <br><br>🌟 LEVEL UP!`;
         
          document.getElementById('level-display').innerText = "👑 Level: " + playerLevel;
          document.getElementById('hp-display').innerText = "❤️ HP: " + playerHP;
         
          kubbleSpeech.innerText = `Level ${playerLevel}! Unstoppable!`;
          levelUpSound.play().catch(e => console.log("Audio prevented"));
        } else {
          kubbleSpeech.innerText = "Aqua Blast! Direct hit!";
          cheerSound.play().catch(e => console.log("Audio prevented"));
        }

        resultText.style.color = "#17b978";
        resultText.innerHTML = "Correct!" + levelUpText;
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
       
        setTimeout(() => {
          map.removeLayer(activeMarkers[spotId]);
          kubbleSpeech.innerText = "Find the next monster!";
          kubbleSprite.src = "image_02bdde.png"; // Back to Neutral
        }, 2000);
       
      } else {
        playerHP -= 20;
        document.getElementById('hp-display').innerText = "❤️ HP: " + playerHP;
       
        kubbleSprite.src = "image_02be1a.png"; // Hurt Kubble[cite: 5]

        if (playerHP <= 0) {
          resultText.style.color = "#ff8b94";
          resultText.innerText = "Game Over.";
          kubbleSpeech.innerText = "Oh no... Let's try again!";
         
          setTimeout(() => {
            alert("Game Over! Refresh to restart.");
            location.reload();
          }, 2000);
        } else {
          resultText.style.color = "#ffcc00";
          resultText.innerText = "-20 HP 💥";
          kubbleSpeech.innerText = "Ouch! Watch out!";
          ouchSound.play().catch(e => console.log("Audio prevented"));
         
          setTimeout(() => {
            kubbleSprite.src = "image_02bdde.png"; // Back to Neutral
          }, 2000);
        }
      }
    };

    // --- IRL Sidequest Logic ---
    document.getElementById('trash-upload').addEventListener('change', function(event) {
      if (event.target.files.length > 0) {
        playerScore += 500;
        document.getElementById('score-display').innerText = "⭐ Score: " + playerScore;
       
        const kubbleSpeech = document.getElementById('kubble-speech');
        const kubbleSprite = document.getElementById('kubble-sprite');
       
        kubbleSpeech.innerText = "IRL HERO! +500 POINTS!";
        kubbleSprite.src = "image_02bdfa.png"; // Happy Kubble[cite: 6]
        cheerSound.play().catch(e => console.log("Audio prevented"));
       
        alert("Hero detected! 500 bonus points awarded!");
        event.target.value = "";
       
        setTimeout(() => {
           kubbleSprite.src = "image_02bdde.png"; // Back to Neutral
           kubbleSpeech.innerText = "Click a monster to battle!";
        }, 3000);
      }
    });
  </script>
</body>
</html>
